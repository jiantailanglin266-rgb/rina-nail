name: Deploy preview to GitHub Pages

# main への push で自動デプロイします。
# なお静的エクスポートでは next/image の最適化と proxy.ts が使えないため、
# 本番は Vercel などの Node ランタイム環境を推奨します。
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Quality checks
        run: |
          npm run typecheck
          npm run lint
          npm run test

      - name: Build (static export)
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # Googleカレンダー「予約スケジュール」の予約ページURL。
          # 未設定でもビルドは通り、予約ページには準備中の案内が表示されます。
          NEXT_PUBLIC_GOOGLE_BOOKING_URL: ${{ vars.NEXT_PUBLIC_GOOGLE_BOOKING_URL }}
        run: npm run build

      # 静的ホスティングでは proxy.ts が動かないため、「/」用の言語振り分けページを生成します
      - name: Generate root redirect
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: node scripts/export-root-redirect.mjs

      # enablement: true で、Settings を手動で開かなくても Pages を有効化します
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    # GitHub Pages の環境保護ルールにより、デプロイできるのはデフォルトブランチだけです。
    # それ以外のブランチでは「失敗」ではなく「スキップ」させ、赤いランを残しません。
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
